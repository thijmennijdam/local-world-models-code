# Planner settings of the archived MPC runs, per Table 1 variant (read by scripts/mpc_table1.py).
# affordance_proximity_gate_scale / finger_close_threshold: contact bias; use_gt_agent_state: kinematics bias.
LWM-100M:
  planner_type: icem
  horizon: 12
  num_samples: 256
  wm_batch_size: 256
  num_iterations: 3
  temperature: 0.1
  elite_fraction: 0.1
  alpha: 0.25
  elites_keep_fraction: 0.5
  noise_beta: 3.0
  history_length: 3
  history_elite_frac: 0.3
  warmup_iters: 5
  online_iters: 3
  cost_type: dual
  ee_aff_weight: 2.0
  aff_goal_weight: 1.0
  terminal_weight: 5.0
  pull_threshold: 1
  clip_affordance: true
  grip_cost_weight: 0.0
  proximity_scale: 0.0
  progress_weight: 15.0
  grip_enabled: false
  grip_hover_threshold: 0.03
  grip_warmup_steps: 5
  grip_close_value: -0.04
  affordance_proximity_gate_scale: null
  finger_close_threshold: null
  use_gt_agent_state: false
  num_replanning_steps: 100
  goal_tolerance: 0.02

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwm"
version = "0.1.0"
description = "Local World Models for Articulated Object Manipulation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Thijmen Nijdam" },
    { name = "Mikel Zhobro" },
    { name = "Christian Gumbsch" },
    { name = "Rahaf Aljundi" },
    { name = "Stratis Gavves" },
    { name = "Andrii Zadaianchuk" },
]
# Versions used to verify this release: torch 2.14, numpy 1.26, hydra-core 1.3,
# pybullet 3.2.7, open3d 0.20, zarr 2.18 (Python 3.11).
dependencies = [
    "torch>=2.0",
    "numpy>=1.23,<2",
    "scipy",
    "hydra-core>=1.2",
    "omegaconf>=2.2",
    "termcolor",
    "tqdm",
    "zarr>=2.12,<3",
    "numcodecs",
    "matplotlib",
    "seaborn",
    "pandas",
    "pyyaml",
    "Pillow",
    "imageio",
    "opencv-python-headless",
    "dill",
    "pybullet>=3.2.5",
    "open3d",
    "trimesh",
    "fpsample",
    "colorednoise",
    "gym==0.22.0",
]

[project.urls]
Homepage = "https://thijmennijdam.github.io/local-world-models/"
Repository = "https://github.com/thijmennijdam/local-world-models-code"
Paper = "https://openreview.net/forum?id=T6LLwbiR4S"

[project.optional-dependencies]
# Experiment tracking during training (off unless WANDB_MODE is set).
wandb = ["wandb"]
# GIF export helper in lwm.sim.utils.save_numpy_as_gif.
gif = ["moviepy<2"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lwm.sim" = ["data/*.json", "assets/**/*"]
